<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/line-awesome/dist/line-awesome/css/line-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.min.css">
    <title>Tomson HUD</title>
    <script type="module" crossorigin src="./index.js"></script>
    <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <!-- Main HUD Container -->
    <div id="app"></div>
    
    <!-- Voice Chat / Microphone Indicator -->
    <div id="voice-indicator" class="voice-indicator" style="display: none;">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <div class="voice-bars">
        <div class="voice-bar" style="height: 30%;"></div>
        <div class="voice-bar" style="height: 60%;"></div>
        <div class="voice-bar" style="height: 100%;"></div>
        <div class="voice-bar" style="height: 50%;"></div>
        <div class="voice-bar" style="height: 40%;"></div>
      </div>
    </div>

    <script>
      // Voice indicator controller
      (function() {
        const voiceIndicator = document.getElementById('voice-indicator');
        
        // Listen for voice state changes from FiveM
        window.addEventListener('message', function(event) {
          const data = event.data;
          
          // Handle voice/microphone state
          if (data.action === 'updateVoice' || data.action === 'setVoiceState') {
            const isActive = data.data?.active || data.data?.talking || false;
            const isVisible = data.data?.visible !== false;
            
            if (isVisible) {
              voiceIndicator.style.display = 'flex';
              if (isActive) {
                voiceIndicator.classList.add('active');
              } else {
                voiceIndicator.classList.remove('active');
              }
            } else {
              voiceIndicator.style.display = 'none';
            }
          }
          
          // Also handle pma-voice / mumble-voip compatibility
          if (data.action === 'setTalking') {
            voiceIndicator.style.display = 'flex';
            if (data.data === true) {
              voiceIndicator.classList.add('active');
            } else {
              voiceIndicator.classList.remove('active');
            }
          }
          
          // Handle radio state
          if (data.action === 'setRadioState') {
            // Could add radio indicator styling here
          }
        });
        
        // For development/testing - show voice indicator
        if (!window.invokeNative) {
          // Dev mode - show voice indicator for testing
          setTimeout(() => {
            voiceIndicator.style.display = 'flex';
            // Simulate talking every 2 seconds for demo
            setInterval(() => {
              voiceIndicator.classList.toggle('active');
            }, 2000);
          }, 1000);
        }
      })();
    </script>
  </body>
</html>
